name: Goal Teams V2.62 phase-aware verification
run-name: Goal Teams V2.62 phase-aware verification ${{ github.sha }}

on:
  push:
    branches: [main, codex/develop-v2.62]
  pull_request:
  workflow_dispatch:
    inputs:
      workflow_phase:
        description: Development never enters S0-S4; release is exact-main only.
        required: true
        type: choice
        default: development
        options: [development, release]
      project_size:
        description: S3 is executed only for a Large Release.
        required: true
        type: choice
        default: medium
        options: [small, medium, large]
      project_start_authorization_receipt_json:
        description: Complete V2.62 project-start authorization receipt JSON; required only for release.
        required: false
        type: string
      controller_handoff_receipt_json:
        description: Installed V2.6 host-issued V2.62 controller handoff JSON; required only for release.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: goal-teams-v250-${{ github.ref }}-${{ inputs.workflow_phase || 'development' }}
  cancel-in-progress: false

jobs:
  check-macos:
    name: check-macos
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Require checkout SSH key
        env:
          CHECKOUT_SSH_KEY: ${{ secrets.GOAL_TEAMS_CHECKOUT_SSH_KEY }}
        run: |
          test -n "${CHECKOUT_SSH_KEY}" || {
            echo "E_V250_CHECKOUT_SSH_KEY_REQUIRED" >&2
            exit 1
          }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GOAL_TEAMS_CHECKOUT_SSH_KEY }}
          persist-credentials: false
      - name: Assert exact SSH fetch and push transport
        run: |
          expected="git@github.com:${GITHUB_REPOSITORY}.git"
          test "$(git remote get-url origin)" = "${expected}"
          test "$(git remote get-url --push origin)" = "${expected}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare pinned Draft 2020 validator outside the worktree
        env:
          VALIDATOR_PYTHON_PREFIX: ${{ runner.temp }}/goal-teams-v250-python
        run: |
          python3 -m pip install \
            --target "${VALIDATOR_PYTHON_PREFIX}" \
            --no-compile \
            --no-cache-dir \
            jsonschema==4.23.0
          PYTHONPATH="${VALIDATOR_PYTHON_PREFIX}" python3 -c \
            'from jsonschema import Draft202012Validator'
          echo "PYTHONPATH=${VALIDATOR_PYTHON_PREFIX}${PYTHONPATH:+:${PYTHONPATH}}" >> "${GITHUB_ENV}"
      - name: Development TDD and incremental gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests/v250 -p 'test_*.py'
          python3 -m unittest discover -s tests/v262 -p 'test_*.py'
          python3 scripts/checks/check-v250.py --phase development --project-size medium --stage candidate

  release-asset-gate:
    name: release-asset-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require checkout SSH key
        env:
          CHECKOUT_SSH_KEY: ${{ secrets.GOAL_TEAMS_CHECKOUT_SSH_KEY }}
        run: |
          test -n "${CHECKOUT_SSH_KEY}" || {
            echo "E_V250_CHECKOUT_SSH_KEY_REQUIRED" >&2
            exit 1
          }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GOAL_TEAMS_CHECKOUT_SSH_KEY }}
          persist-credentials: false
      - name: Assert exact SSH fetch and push transport
        run: |
          expected="git@github.com:${GITHUB_REPOSITORY}.git"
          test "$(git remote get-url origin)" = "${expected}"
          test "$(git remote get-url --push origin)" = "${expected}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare pinned Draft 2020 validator outside the worktree
        env:
          VALIDATOR_PYTHON_PREFIX: ${{ runner.temp }}/goal-teams-v250-python
        run: |
          python3 -m pip install \
            --target "${VALIDATOR_PYTHON_PREFIX}" \
            --no-compile \
            --no-cache-dir \
            jsonschema==4.23.0
          PYTHONPATH="${VALIDATOR_PYTHON_PREFIX}" python3 -c \
            'from jsonschema import Draft202012Validator'
          echo "PYTHONPATH=${VALIDATOR_PYTHON_PREFIX}${PYTHONPATH:+:${PYTHONPATH}}" >> "${GITHUB_ENV}"
      - name: Detect the explicit V2.62 workflow phase
        id: release-version
        run: |
          product_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.workflow_phase }}" = "release" ] && [ "${product_version}" = "V2.62" ]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release=false" >> "${GITHUB_OUTPUT}"
            echo "Candidate/development run: S0-S4 and asset construction are not required."
          fi
      - name: Validate development contracts without release gates
        if: steps.release-version.outputs.release != 'true'
        run: python3 scripts/checks/check-v250.py --phase development --project-size medium --stage candidate
      - name: Require exact clean released main identity
        id: identity
        if: steps.release-version.outputs.release == 'true'
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet "${GITHUB_SHA}" --
          git diff --cached --quiet "${GITHUB_SHA}" --
      - name: Materialize the existing project-start authorization receipt
        id: authorization
        if: steps.release-version.outputs.release == 'true'
        env:
          AUTHORIZATION_RECEIPT_JSON: ${{ inputs.project_start_authorization_receipt_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("AUTHORIZATION_RECEIPT_JSON", "")
          value = json.loads(raw)
          if not isinstance(value, dict):
              raise SystemExit("project-start authorization receipt must be an object")
          Path(os.environ["RUNNER_TEMP"], "authorization.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True), encoding="utf-8"
          )
          PY
      - name: Materialize the installed V2.6 host-issued V2.62 controller handoff
        id: controller_handoff
        if: steps.release-version.outputs.release == 'true'
        env:
          CONTROLLER_HANDOFF_RECEIPT_JSON: ${{ inputs.controller_handoff_receipt_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("CONTROLLER_HANDOFF_RECEIPT_JSON", "")
          value = json.loads(raw)
          if not isinstance(value, dict):
              raise SystemExit("E_V250_CONTROLLER_HANDOFF_REQUIRED")
          Path(os.environ["RUNNER_TEMP"], "controller-handoff.json").write_text(
              json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Materialize the exact trusted Release route receipt
        id: release_route
        if: steps.release-version.outputs.release == 'true'
        env:
          PROJECT_SIZE: ${{ inputs.project_size }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.v250.generation_runtime import load_generation
          from scripts.v250.route_closure import compile_route_closure

          route_id = {
              "small": "V250-ROUTE-MEDIUM-RELEASE",
              "medium": "V250-ROUTE-MEDIUM-RELEASE",
              "large": "V250-ROUTE-LARGE-RELEASE",
          }.get(os.environ["PROJECT_SIZE"])
          if route_id is None:
              raise SystemExit("E_V250_WORKFLOW_RELEASE_ROUTE")
          root = Path.cwd()
          receipt = compile_route_closure(root, load_generation(root), route_id)
          Path(os.environ["RUNNER_TEMP"], "release-route-receipt.json").write_text(
              json.dumps(
                  receipt,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify the pinned GitHub owner public key before host launch
        id: github_owner_key
        if: steps.release-version.outputs.release == 'true'
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/users/vibe-coding-era/keys \
            > "${RUNNER_TEMP}/github-owner-keys.json"
          python3 scripts/v250/runtime_host_adapter.py verify-github-key \
            --github-keys "${RUNNER_TEMP}/github-owner-keys.json" \
            > "${RUNNER_TEMP}/github-owner-key-validation.json"
      - name: Launch fresh released runtime through the external host adapter before S0
        id: runtime_transition
        if: steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/v250/runtime_host_adapter.py launch \
            --stage released \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            --project-size "${{ inputs.project_size }}" \
            --route-receipt "${RUNNER_TEMP}/release-route-receipt.json" \
            --authorization-receipt "${RUNNER_TEMP}/authorization.json" \
            --controller-handoff-receipt "${RUNNER_TEMP}/controller-handoff.json" \
            --host-execution-id "${GITHUB_RUN_ID}" \
            --adapter-identity github-actions-release-host-adapter \
            --adapter-code scripts/v250/runtime_host_adapter.py \
            > "${RUNNER_TEMP}/released-runtime-transition.json"
      - name: Run exact Current full regression and separate-process security review once
        id: s1
        if: steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/checks/check-v250.py \
            --phase release \
            --project-size "${{ inputs.project_size }}" \
            --stage released \
            --release-intent \
            --implementation-scope-complete \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            --expected-host-execution-id "${GITHUB_RUN_ID}" \
            --released-runtime-receipt "${RUNNER_TEMP}/released-runtime-transition.json" \
            > "${RUNNER_TEMP}/s1-check.json"
      - name: Build the exact released asset set once
        id: s2_build
        if: steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/release/build-release.py \
            --version V2.62 \
            --commit "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --output-root release/versions \
            > "${RUNNER_TEMP}/s2-build.json"
      - name: Validate frozen-source integrity of the same built asset set
        id: asset_validation
        if: steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/release/skill_release.py validate \
            --version V2.62 \
            --commit "${GITHUB_SHA}" \
            --release-root release/versions \
            --build-receipt "${RUNNER_TEMP}/s2-build.json" \
            > "${RUNNER_TEMP}/asset-validation.json"
      - name: Run independent repository and same-asset boundary gate
        id: repository_boundary
        if: steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/v250/repository_boundary.py \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            --s2-receipt "${RUNNER_TEMP}/asset-validation.json" \
            --asset-validation-receipt "${RUNNER_TEMP}/asset-validation.json" \
            --release-root release/versions \
            > "${RUNNER_TEMP}/repository-boundary.json"
      - name: Revalidate frozen source and boundary before Large S3
        id: boundary_pre_s3
        if: steps.release-version.outputs.release == 'true' && inputs.project_size == 'large'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/v250/repository_boundary.py \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            --s2-receipt "${RUNNER_TEMP}/asset-validation.json" \
            --asset-validation-receipt "${RUNNER_TEMP}/asset-validation.json" \
            --release-root release/versions \
            --reuse-receipt "${RUNNER_TEMP}/repository-boundary.json" \
            > "${RUNNER_TEMP}/repository-boundary-pre-s3.json"
      - name: Prepare the isolated Large S3 input without rebuilding
        id: s3_prepare
        if: steps.release-version.outputs.release == 'true' && inputs.project_size == 'large'
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          receipt = json.loads((temp / "asset-validation.json").read_text(encoding="utf-8"))
          release_root = Path("release/versions/V2.62").resolve()
          bundle = temp / "release-bundle"
          bundle.mkdir()
          for name, source in receipt["public_asset_sources"].items():
              source_path = Path(source).resolve()
              source_path.relative_to(release_root)
              shutil.copy2(source_path, bundle / name)
          (temp / "installer-identity.json").write_text(
              json.dumps(receipt["installer_release_identity"], ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Run Large-only isolated S3 install lifecycle once
        id: s3_install
        if: steps.release-version.outputs.release == 'true' && inputs.project_size == 'large'
        env:
          GOAL_TEAMS_RELEASE_REHEARSAL: '1'
          GOAL_TEAMS_INSTALL_TEST_VALIDATION: '1'
        run: |
          CODEX_HOME="${RUNNER_TEMP}/codex-home" \
          INSTALL_REPORT="${RUNNER_TEMP}/codex-home/state/goal-teams/reports/s3-install-report.json" \
          ./scripts/install/install-local.sh \
            --release-bundle "${RUNNER_TEMP}/release-bundle" \
            --release-identity "${RUNNER_TEMP}/installer-identity.json"
      - name: Bind the Large-only or not-required S3 receipt
        id: s3_bind
        if: steps.release-version.outputs.release == 'true'
        run: |
          if [ "${{ inputs.project_size }}" = "large" ]; then
            python3 scripts/release/skill_release.py s3-receipt \
              --project-size large \
              --s2-receipt "${RUNNER_TEMP}/asset-validation.json" \
              --install-report "${RUNNER_TEMP}/codex-home/state/goal-teams/reports/s3-install-report.json" \
              > "${RUNNER_TEMP}/s3.json"
          else
            python3 scripts/release/skill_release.py s3-receipt \
              --project-size "${{ inputs.project_size }}" \
              --s2-receipt "${RUNNER_TEMP}/asset-validation.json" \
              > "${RUNNER_TEMP}/s3.json"
          fi
      - name: Revalidate frozen source and boundary before S4
        id: boundary_pre_s4
        if: steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ "${{ inputs.project_size }}" = "large" ]; then
            prior_boundary="${RUNNER_TEMP}/repository-boundary-pre-s3.json"
          else
            prior_boundary="${RUNNER_TEMP}/repository-boundary.json"
          fi
          python3 scripts/v250/repository_boundary.py \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            --s2-receipt "${RUNNER_TEMP}/asset-validation.json" \
            --asset-validation-receipt "${RUNNER_TEMP}/asset-validation.json" \
            --release-root release/versions \
            --reuse-receipt "${prior_boundary}" \
            > "${RUNNER_TEMP}/repository-boundary-pre-s4.json"
      - name: Create the S4 authorized-operation plan without external writes
        id: s4_plan
        if: steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          report_failure() {
            python3 - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              value = {}
          summary = {
              key: value.get(key)
              for key in ("command", "status", "error_code")
          }
          print(json.dumps(summary, sort_keys=True), file=sys.stderr)
          PY
          }
          if ! python3 scripts/release/skill_release.py preflight \
            --version V2.62 \
            --commit "${GITHUB_SHA}" \
            --project-size "${{ inputs.project_size }}" \
            --authorization-receipt "${RUNNER_TEMP}/authorization.json" \
            --s1-check-receipt "${RUNNER_TEMP}/s1-check.json" \
            --asset-validation-receipt "${RUNNER_TEMP}/asset-validation.json" \
            --s3-receipt "${RUNNER_TEMP}/s3.json" \
            --boundary-receipt "${RUNNER_TEMP}/repository-boundary-pre-s4.json" \
            > "${RUNNER_TEMP}/preflight-output.json"; then
            report_failure "${RUNNER_TEMP}/preflight-output.json"
            exit 1
          fi
          if ! python3 scripts/release/skill_release.py plan-s4 \
            --version V2.62 \
            --commit "${GITHUB_SHA}" \
            --release-control-receipt "${RUNNER_TEMP}/preflight-output.json" \
            > "${RUNNER_TEMP}/plan-output.json"; then
            report_failure "${RUNNER_TEMP}/plan-output.json"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path(os.environ["RUNNER_TEMP"], "plan-output.json").read_text(
                  encoding="utf-8"
              )
          )
          if (
              plan.get("status") != "authorized_operation_plan_not_executed"
              or plan.get("publish_state") != "authorized_not_executed"
              or plan.get("external_side_effect_count") != 0
              or plan.get("action_executed") is not False
          ):
              raise SystemExit("E_V250_WORKFLOW_PLAN_ONLY_ASSERTION")
          PY
          cp "${RUNNER_TEMP}/preflight-output.json" "${RUNNER_TEMP}/release-control.json"
          cp "${RUNNER_TEMP}/plan-output.json" "${RUNNER_TEMP}/s4-authorized-operation-plan.json"
      - name: Verify the same fixed four-asset identity without rebuilding
        id: asset_verify
        if: steps.release-version.outputs.release == 'true'
        run: |
          test -f "release/versions/V2.62/_artifacts/goal-teams-V2.62.tar.gz"
          test -f "release/versions/V2.62/_artifacts/SHA256SUMS"
          test -f "release/versions/V2.62/_release.json"
          test -f "release/versions/V2.62/_files.sha256"
          cd "release/versions/V2.62/_artifacts"
          sha256sum -c SHA256SUMS
      - name: Stage exact receipts for cross-job S4 continuation without rebuilding
        id: stage_receipts
        if: always() && steps.release-version.outputs.release == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          receipt_root="release/versions/V2.62/_receipts"
          diagnostic_root="release/versions/V2.62/_diagnostics"
          mkdir -p "${receipt_root}" "${diagnostic_root}/observed_outputs"
          formal_receipt_names=(
            authorization.json
            controller-handoff.json
            github-owner-key-validation.json
            release-route-receipt.json
            released-runtime-transition.json
            s1-check.json
            s2-build.json
            asset-validation.json
            repository-boundary.json
            repository-boundary-pre-s4.json
            s3.json
            release-control.json
            s4-authorized-operation-plan.json
          )
          diagnostic_output_names=(
            s2-build.json
            asset-validation.json
            preflight-output.json
            plan-output.json
          )
          checkpoint_job_status="${{ job.status }}"
          if [ "${{ job.status }}" = "success" ]; then
            for name in "${formal_receipt_names[@]}"; do
              if ! cp "${RUNNER_TEMP}/${name}" "${receipt_root}/${name}"; then
                checkpoint_job_status="failure"
              fi
            done
          fi
          if [ "${{ job.status }}" != "success" ]; then
            for name in "${diagnostic_output_names[@]}"; do
              if [ -f "${RUNNER_TEMP}/${name}" ]; then
                cp \
                  "${RUNNER_TEMP}/${name}" \
                  "${diagnostic_root}/observed_outputs/${name}"
              fi
            done
          fi
          if [ "${checkpoint_job_status}" = "success" ]; then
            checkpoint_source_root="${receipt_root}"
          else
            checkpoint_source_root="${RUNNER_TEMP}"
          fi
          python3 scripts/release/skill_release.py checkpoint \
            --version V2.62 \
            --commit "${GITHUB_SHA}" \
            --project-size "${{ inputs.project_size }}" \
            --job-status "${checkpoint_job_status}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --gate-outcome "identity=${{ steps.identity.outcome }}" \
            --gate-outcome "authorization=${{ steps.authorization.outcome }}" \
            --gate-outcome "controller_handoff=${{ steps.controller_handoff.outcome }}" \
            --gate-outcome "release_route=${{ steps.release_route.outcome }}" \
            --gate-outcome "github_owner_key=${{ steps.github_owner_key.outcome }}" \
            --gate-outcome "runtime_transition=${{ steps.runtime_transition.outcome }}" \
            --gate-outcome "s1=${{ steps.s1.outcome }}" \
            --gate-outcome "s2_build=${{ steps.s2_build.outcome }}" \
            --gate-outcome "asset_validation=${{ steps.asset_validation.outcome }}" \
            --gate-outcome "repository_boundary=${{ steps.repository_boundary.outcome }}" \
            --gate-outcome "boundary_pre_s3=${{ steps.boundary_pre_s3.outcome }}" \
            --gate-outcome "s3_prepare=${{ steps.s3_prepare.outcome }}" \
            --gate-outcome "s3_install=${{ steps.s3_install.outcome }}" \
            --gate-outcome "s3_bind=${{ steps.s3_bind.outcome }}" \
            --gate-outcome "boundary_pre_s4=${{ steps.boundary_pre_s4.outcome }}" \
            --gate-outcome "s4_plan=${{ steps.s4_plan.outcome }}" \
            --gate-outcome "asset_verify=${{ steps.asset_verify.outcome }}" \
            --receipt-source-root "${checkpoint_source_root}" \
            --release-root release/versions \
            > "${diagnostic_root}/checkpoint-output.json"
          checkpoint_state="$(python3 - "${diagnostic_root}/checkpoint-output.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          state = value.get("state")
          if state not in {"ready_for_s4", "diagnostic_partial"}:
              raise SystemExit("E_V250_CHECKPOINT_STATE")
          print(state)
          PY
          )"
          echo "checkpoint_state=${checkpoint_state}" >> "${GITHUB_OUTPUT}"
          if [ "${checkpoint_state}" = "ready_for_s4" ]; then
            cp \
              "${diagnostic_root}/checkpoint-output.json" \
              "${receipt_root}/_checkpoint.json"
            python3 scripts/release/skill_release.py verify-checkpoint \
              --version V2.62 \
              --commit "${GITHUB_SHA}" \
              --checkpoint-receipt "${receipt_root}/_checkpoint.json" \
              --receipt-root "${receipt_root}" \
              --release-root release/versions \
              --expected-workflow-run-id "${GITHUB_RUN_ID}" \
              --expected-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              > "${diagnostic_root}/continuation-checkpoint-validation.json"
          elif [ "${{ job.status }}" = "success" ]; then
            exit 1
          fi
      - name: Persist the ready asset set and receipt chain for authorized S4 continuation
        if: >-
          always() &&
          steps.release-version.outputs.release == 'true' &&
          steps.stage_receipts.outcome == 'success' &&
          steps.stage_receipts.outputs.checkpoint_state == 'ready_for_s4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal-teams-v250-release-${{ github.sha }}
          path: |
            release/versions/V2.62/_artifacts/goal-teams-V2.62.tar.gz
            release/versions/V2.62/_artifacts/SHA256SUMS
            release/versions/V2.62/_release.json
            release/versions/V2.62/_files.sha256
            release/versions/V2.62/_receipts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Persist failure diagnostics without a continuation artifact
        if: >-
          always() &&
          steps.release-version.outputs.release == 'true' &&
          (steps.stage_receipts.outcome != 'success' ||
          steps.stage_receipts.outputs.checkpoint_state != 'ready_for_s4')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal-teams-v250-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/versions/V2.62/_diagnostics/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
