name: Goal Teams V2.48 Skill verification
run-name: Goal Teams V2.48 Skill verification ${{ github.sha }}

on:
  push:
    branches: [main, codex/v2.48-release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal-teams-v248-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ubuntu:
    name: check-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Full deterministic gate
        env:
          GOAL_TEAMS_INSTALL_VALIDATION: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: ./scripts/check.sh

  check-macos:
    name: check-macos
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Full deterministic gate
        env:
          GOAL_TEAMS_INSTALL_VALIDATION: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: ./scripts/check.sh

  release-asset-gate:
    name: release-asset-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Detect whether the V2.48 release gate applies
        id: release-version
        run: |
          product_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${product_version}" = "V2.48" ]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "V2.48 release asset gate is not applicable to product ${product_version}."
          fi
      - name: Build twice from the exact candidate commit
        if: steps.release-version.outputs.build == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/release/build-release.py --version V2.48 --commit "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --output-root "${RUNNER_TEMP}/release-a"
          python3 scripts/release/build-release.py --version V2.48 --commit "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --output-root "${RUNNER_TEMP}/release-b"
          diff -rq "${RUNNER_TEMP}/release-a/V2.48" "${RUNNER_TEMP}/release-b/V2.48"
      - name: Independently validate both isolated release trees
        if: steps.release-version.outputs.build == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/release/validate-release.py --version V2.48 --release-root "${RUNNER_TEMP}/release-a" --isolated-no-docs-archive
          python3 scripts/release/validate-release.py --version V2.48 --release-root "${RUNNER_TEMP}/release-b" --isolated-no-docs-archive
      - name: Verify fixed four-asset identity
        if: steps.release-version.outputs.build == 'true'
        run: |
          test -f "${RUNNER_TEMP}/release-a/V2.48/_artifacts/goal-teams-V2.48.tar.gz"
          test -f "${RUNNER_TEMP}/release-a/V2.48/_artifacts/SHA256SUMS"
          test -f "${RUNNER_TEMP}/release-a/V2.48/_release.json"
          test -f "${RUNNER_TEMP}/release-a/V2.48/_files.sha256"
          cd "${RUNNER_TEMP}/release-a/V2.48/_artifacts"
          sha256sum -c SHA256SUMS
