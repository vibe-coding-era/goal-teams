name: windows-single-test-probe

on:
  push:
    branches: ["codex/v2.95-windows-probe"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  windows-single-test:
    name: Windows Python 3.13 integrity regression probe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Prepare isolated fixtures
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/develops/windows-probe-tmp"
      - name: Run exact failing integrity case
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ github.workspace }}/develops/windows-probe-tmp
          TEMP: ${{ github.workspace }}/develops/windows-probe-tmp
          TMP: ${{ github.workspace }}/develops/windows-probe-tmp
          GIT_CEILING_DIRECTORIES: ${{ github.workspace }}/develops
        shell: bash
        run: python -m unittest -v tests.test_gt_integrity.ExternalReviewTests.test_r01_spec_change_stales_the_review
