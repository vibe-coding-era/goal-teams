name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test (ubuntu-latest, Python 3.9)
            os: ubuntu-latest
            python: "3.9"
          - name: test (ubuntu-latest, Python 3.13)
            os: ubuntu-latest
            python: "3.13"
          # Keep the required context attached to the real macOS test job.
          - name: check-macos
            os: macos-latest
            python: "3.13"
          - name: test (windows-latest, Python 3.13)
            os: windows-latest
            python: "3.13"
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Repository checks
        shell: bash
        run: python tools/check.py
      - name: Generated files are up to date
        shell: bash
        run: python tools/gen.py --check
      - name: Unit tests
        shell: bash
        run: python -m unittest discover -s tests -t . -v
      - name: Examples match real gt output
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/make_examples.py --check
      - name: okf-graph tests
        # extras/okf-graph does not support Windows (it refuses to run there).
        if: runner.os != 'Windows'
        shell: bash
        run: python -m unittest discover -s extras/okf-graph/tests -t extras/okf-graph -v

  release-asset-gate:
    name: release-asset-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ github.workspace }}/develops/ci-release-tmp
      GIT_CEILING_DIRECTORIES: ${{ github.workspace }}/develops
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Prepare isolated test fixtures
        shell: bash
        run: mkdir -p "$TMPDIR"
      - name: Repository and generated package checks
        shell: bash
        run: |
          python tools/check.py
          python tools/gen.py --check
      - name: Release and installer regressions
        # Builds in these tests belong to disposable fixtures, never this candidate.
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_release \
            tests.test_install \
            tests.test_ed25519_verify \
            tests.test_v295_release \
            tests.test_v295_release_race \
            tests.test_v295_tools
      - name: Validate frozen package inputs without building assets
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools import release

          root = Path.cwd()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          forbidden = [p for p in tracked if p and p.split("/")[0] in {"docs", "develops", ".goal-teams"}]
          if forbidden:
              raise SystemExit("Local-only paths are tracked: " + ", ".join(forbidden))
          warned = set()
          entries, commit, tree, _ = release.collect_from_git(root, False, warned)
          entries = release.finalize(entries, warned)
          if not commit or tree != release.git_out(root, "rev-parse", commit + "^{tree}").decode().strip():
              raise SystemExit("Package inputs are not bound to one committed tree")
          if warned:
              raise SystemExit("Untracked package inputs would be omitted: " + ", ".join(sorted(warned)))
          for path, mode, data in entries:
              if (not release.in_release_set(path) or release.path_problem(path)
                      or release.is_excluded(path) or mode not in (0o644, 0o755)):
                  raise SystemExit("Invalid package input: " + path)
              if data != release.git_out(root, "cat-file", "blob", commit + ":" + path):
                  raise SystemExit("Package input differs from committed blob: " + path)
          print("Validated %d package files at %s (tree %s); no candidate assets built." % (len(entries), commit, tree))
          PY

  plugin-validate:
    name: plugin-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        shell: bash
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.302
      - name: Validate the plugin
        shell: bash
        run: claude plugin validate --strict plugins/goal-teams
      - name: Validate the marketplace
        shell: bash
        run: claude plugin validate --strict .
