name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Repository checks
        shell: bash
        run: python tools/check.py
      - name: Generated files are up to date
        shell: bash
        run: python tools/gen.py --check
      - name: Unit tests
        shell: bash
        run: python -m unittest discover -s tests -t . -v
      - name: Examples match real gt output
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/make_examples.py --check
      - name: okf-graph tests
        # extras/okf-graph does not support Windows (it refuses to run there).
        if: runner.os != 'Windows'
        shell: bash
        run: python -m unittest discover -s extras/okf-graph/tests -t extras/okf-graph -v

  plugin-validate:
    name: plugin-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        shell: bash
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.302
      - name: Validate the plugin
        shell: bash
        run: claude plugin validate --strict plugins/goal-teams
      - name: Validate the marketplace
        shell: bash
        run: claude plugin validate --strict .
