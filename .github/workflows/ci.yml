name: windows-concurrent-run-diagnostic

on:
  push:
    branches: ["codex/v2.95-windows-probe"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  windows-single-test:
    name: Windows Python 3.13 concurrent run diagnostic
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Prepare isolated fixtures
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/develops/windows-probe-tmp"
      - name: Diagnose exact concurrent run case without changing assertions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ github.workspace }}/develops/windows-probe-tmp
          TEMP: ${{ github.workspace }}/develops/windows-probe-tmp
          TMP: ${{ github.workspace }}/develops/windows-probe-tmp
          GIT_CEILING_DIRECTORIES: ${{ github.workspace }}/develops
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import threading
          import time
          import unittest
          from unittest import mock
          from pathlib import Path
          from tests import test_gt
          from tests.test_gt import Repo
          from tests.test_gt_integrity import RunReceiptTests
          from goalteams.state import reduce
          from goalteams.graph_budget import status as budget_status
          from goalteams.util import FileLock

          trace_dir = Path.cwd() / 'develops/windows-lock-traces'
          trace_dir.mkdir(parents=True, exist_ok=True)
          bootstrap = trace_dir / 'gt_lock_diagnostic.py'
          bootstrap.write_text('''import json
          import os
          import sys
          import time
          import traceback
          from pathlib import Path

          root = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(root / 'plugins/goal-teams/skills/goal-teams/scripts'))
          from goalteams.util import FileLock, pid_alive
          from goalteams.cli import main

          trace_path = Path(__file__).parent / ('pid-%d.jsonl' % os.getpid())
          def log(event, **values):
              row = dict(event=event, pid=os.getpid(), monotonic=time.monotonic(), **values)
              with trace_path.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps(row, ensure_ascii=False) + '\\n')

          def holder(path):
              try:
                  text = path.read_text(encoding='ascii', errors='replace')
                  parts = text.split()
                  owner = int(parts[0]) if parts and parts[0].isdigit() else None
                  return dict(content=text, owner_pid=owner, owner_alive=pid_alive(owner) if owner else None)
              except OSError as exc:
                  return dict(read_error=repr(exc))

          enter, leave, remove = FileLock.__enter__, FileLock.__exit__, os.remove
          def traced_enter(self):
              start = time.monotonic()
              log('enter_wait', path=str(self.path), timeout=self.timeout,
                  call_stack=traceback.format_stack(limit=8))
              try:
                  result = enter(self)
              except BaseException as exc:
                  log('enter_error', path=str(self.path), elapsed=time.monotonic()-start,
                      error=repr(exc), holder=holder(self.path))
                  raise
              self._diagnostic_acquired_at = time.monotonic()
              log('acquired', path=str(self.path), elapsed=self._diagnostic_acquired_at-start)
              return result

          def traced_leave(self, *args):
              acquired = getattr(self, '_diagnostic_acquired_at', None)
              log('release_begin', path=str(self.path),
                  critical_duration=time.monotonic()-acquired if acquired is not None else None)
              try:
                  return leave(self, *args)
              finally:
                  log('release_end', path=str(self.path), exists=self.path.exists())

          def traced_remove(path, *args, **kwargs):
              target = str(path).replace('\\\\', '/')
              if not target.endswith('/.goal-teams/.lock'):
                  return remove(path, *args, **kwargs)
              try:
                  result = remove(path, *args, **kwargs)
              except OSError as exc:
                  log('remove_error', path=str(path), error=repr(exc),
                      errno=exc.errno, winerror=getattr(exc, 'winerror', None))
                  raise
              log('removed', path=str(path))
              return result

          FileLock.__enter__, FileLock.__exit__, os.remove = traced_enter, traced_leave, traced_remove
          log('process_start', argv=sys.argv)
          try:
              code = main()
          finally:
              log('process_end')
          raise SystemExit(code)
          ''', encoding='utf-8')
          test_gt.GT = bootstrap
          original = Repo.gt
          observations = []
          lock = threading.Lock()

          def traced_gt(self, *args, **kwargs):
              started = time.monotonic()
              result = original(self, *args, **kwargs)
              if args[:2] == ('run', 'T1'):
                  row = dict(args=list(args), elapsed=time.monotonic() - started,
                             exit_code=result.returncode, stdout=result.stdout, stderr=result.stderr)
                  with lock:
                      observations.append(row)
              return result

          Repo.gt = traced_gt
          original_case = RunReceiptTests.test_concurrent_runs_all_succeed
          def audited_case(self):
              # Execute the unchanged test and every original assertion first.
              original_case(self)
              events = self.repo.events()
              starts = [event for event in events if event['type'] == 'run.started']
              receipts = [event['data'] for event in events if event['type'] == 'run']
              state = reduce(events)
              budget = budget_status(state)
              self.assertEqual(len(starts), 12)
              self.assertEqual(len(receipts), 12)
              self.assertEqual(len({receipt['id'] for receipt in receipts}), 12)
              self.assertEqual(len({receipt['started'] for receipt in receipts}), 12)
              self.assertEqual({event['seq'] for event in starts},
                               {receipt['started'] for receipt in receipts})
              start_by_seq = {event['seq']: event['data'] for event in starts}
              for receipt in receipts:
                  self.assertEqual(receipt['exit_code'], 0)
                  self.assertFalse(receipt.get('late'))
                  self.assertEqual(receipt['graph_charge_sha256'],
                                   start_by_seq[receipt['started']]['graph_charge']['sha256'])
                  self.assertTrue((self.repo.path / receipt['log']).is_file())
              self.assertEqual(len({receipt['log'] for receipt in receipts}), 12)
              self.assertEqual(len(state.receipts), 12)
              self.assertEqual(len(state.graph_charges), 12)
              self.assertEqual(len({charge['operation'] for charge in state.graph_charges}), 12)
              self.assertEqual(budget['tasks']['T1']['consumed']['work_units'], 12)
              self.assertEqual(sum(budget['tasks']['T1']['consumed'][axis]
                                   for axis in ('attempts', 'revalidations')), 12)
              self.assertEqual(budget['errors'], [])
              self.assertEqual(state.graph_errors, [])
              self.assertEqual(dict(state.running), {})
              self.assertEqual(state.foreign_receipts, [])
              self.assertFalse((self.repo.path / '.goal-teams/.lock').exists())
              print('CONCURRENT_INTEGRITY_RESULT ' + json.dumps(dict(
                  passed=True, starts=len(starts), receipts=len(receipts),
                  unique_receipts=len(state.receipts), charges=len(state.graph_charges),
                  budget=budget, running=dict(state.running),
                  lock_exists=False, receipt_logs_present=12)), flush=True)
          RunReceiptTests.test_concurrent_runs_all_succeed = audited_case
          class ControlledSharingReleaseTests(unittest.TestCase):
              def runTest(self):
                  self.assertEqual(os.name, 'nt', 'this is a real Windows sharing scenario')
                  path = trace_dir / 'controlled-sharing.lock'
                  gate = FileLock(path)
                  gate.__enter__()
                  reader = path.open('rb')
                  attempted, closed = threading.Event(), threading.Event()
                  violations = []
                  remove = os.remove
                  def observed_remove(target, *args, **kwargs):
                      try:
                          return remove(target, *args, **kwargs)
                      except OSError as exc:
                          if Path(target) == path:
                              violations.append(dict(error=repr(exc), errno=exc.errno,
                                                     winerror=getattr(exc, 'winerror', None),
                                                     monotonic=time.monotonic()))
                              attempted.set()
                          raise
                  def close_reader():
                      attempted.wait(timeout=3)
                      time.sleep(0.1)
                      reader.close()
                      closed.set()
                  closer = threading.Thread(target=close_reader)
                  closer.start()
                  started = time.monotonic()
                  try:
                      with mock.patch('goalteams.util.os.remove', side_effect=observed_remove):
                          gate.__exit__(None, None, None)
                      elapsed = time.monotonic() - started
                      closer.join(timeout=5)
                      self.assertTrue(violations, 'must observe an actual Windows sharing violation')
                      self.assertTrue(all(row['winerror'] == 32 for row in violations))
                      self.assertTrue(closed.is_set())
                      self.assertTrue(reader.closed)
                      self.assertFalse(path.exists())
                      with FileLock(path):
                          self.assertTrue(path.exists())
                      self.assertFalse(path.exists())
                      print('CONTROLLED_WINDOWS_SHARING_RESULT ' + json.dumps(dict(
                          passed=True, real_violations=violations, release_seconds=elapsed,
                          reader_closed=reader.closed, lock_exists=False, reacquire_passed=True)), flush=True)
                  finally:
                      attempted.set()
                      closer.join(timeout=5)
                      reader.close()
                      if path.exists():
                          path.unlink()
          suite = unittest.defaultTestLoader.loadTestsFromName(
              'tests.test_gt_integrity.RunReceiptTests.test_concurrent_runs_all_succeed')
          suite.addTest(ControlledSharingReleaseTests())
          result = unittest.TextTestRunner(verbosity=2, stream=sys.stdout).run(suite)
          print('CONCURRENT_CHILD_DIAGNOSTICS_BEGIN', flush=True)
          print(json.dumps(dict(source_base='cdcf8af04c7eca6f36a26be8528dfe130a6d6192',
                                diagnostic_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                                child_count=len(observations), observations=observations),
                           ensure_ascii=False, indent=2), flush=True)
          print('CONCURRENT_CHILD_DIAGNOSTICS_END', flush=True)
          print('FILELOCK_TRACE_BEGIN', flush=True)
          for path in sorted(trace_dir.glob('pid-*.jsonl')):
              print(path.read_text(encoding='utf-8'), end='', flush=True)
          print('FILELOCK_TRACE_END', flush=True)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
