name: windows-state-hash-mechanism-diagnostic

on:
  push:
    branches: ["codex/v2.95-windows-probe"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  windows-single-test:
    name: Windows Python 3.13 state hash replace mechanism
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Prepare isolated fixtures
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/develops/windows-probe-tmp"
      - name: Controlled real state reader against real gt append
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ github.workspace }}/develops/windows-probe-tmp
          TEMP: ${{ github.workspace }}/develops/windows-probe-tmp
          TMP: ${{ github.workspace }}/develops/windows-probe-tmp
          GIT_CEILING_DIRECTORIES: ${{ github.workspace }}/develops
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import time
          import unittest
          from pathlib import Path
          from tests.test_gt import Repo, SCRIPTS, medium_goal

          trace_dir = Path.cwd() / 'develops/windows-state-hash-traces'
          trace_dir.mkdir(parents=True, exist_ok=True)
          reader_script = trace_dir / 'state_hash_reader.py'
          reader_script.write_text('''import json
          import sys
          import time
          from pathlib import Path

          scripts, project, ready, release = map(Path, sys.argv[1:])
          sys.path.insert(0, str(scripts))
          from goalteams import gitinfo

          original = gitinfo._hash_paths
          def synchronized_hash(work_tree, paths):
              # The production content_ids chooses these exact paths. Extend only
              # a real state candidate's read lifetime to control the schedule.
              observed = dict(paths=list(paths), ignored_paths=[p for p in paths if gitinfo.ignored(p)],
                              held_path=None, held_read_bytes=0, hold_budget_seconds=15)
              reader = None
              try:
                  if '.goal-teams/ledger.head' in paths:
                      reader = (work_tree / '.goal-teams/ledger.head').open('rb')
                      observed['held_path'] = str(work_tree / '.goal-teams/ledger.head')
                      observed['held_read_bytes'] = len(reader.read())
                  result = original(work_tree, paths)
                  ready.write_text(json.dumps(observed), encoding='utf-8')
                  until = time.monotonic() + 15
                  while reader is not None and not release.exists() and time.monotonic() < until:
                      time.sleep(0.01)
                  return result
              finally:
                  if reader is not None:
                      reader.close()
                  observed['reader_closed'] = reader is None or reader.closed
                  observed['released_by_signal'] = release.exists()
                  print(json.dumps(observed), flush=True)
          gitinfo._hash_paths = synchronized_hash
          ids = gitinfo.content_ids(project)
          print(json.dumps(dict(content_ids_count=len(ids), ignored_result_paths=[p for p in ids if gitinfo.ignored(p)])), flush=True)
          ''', encoding='utf-8')

          class StateHashReplaceMechanism(unittest.TestCase):
              def runTest(self):
                  self.assertEqual(os.name, 'nt')
                  repo = Repo()
                  self.addCleanup(repo.close)
                  medium_goal(repo)
                  repo.ok('plan', 'apply')
                  ready = trace_dir / 'reader-ready.json'
                  release = trace_dir / 'reader-release'
                  reader = subprocess.Popen([sys.executable, str(reader_script), str(SCRIPTS),
                                             str(repo.path), str(ready), str(release)],
                                            stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                            text=True, encoding='utf-8')
                  deadline = time.monotonic() + 10
                  try:
                      while not ready.exists() and reader.poll() is None and time.monotonic() < deadline:
                          time.sleep(0.01)
                      self.assertTrue(ready.exists(), 'real content_ids must reach its hash boundary')
                      observation = json.loads(ready.read_text(encoding='utf-8'))
                      result = repo.gt('run', 'T1', '--kind', 'lint', '--', sys.executable, '-c', 'pass')
                  finally:
                      release.write_text('release real reader', encoding='utf-8')
                      try:
                          reader_stdout, reader_stderr = reader.communicate(timeout=20)
                      except subprocess.TimeoutExpired:
                          reader.kill()
                          reader_stdout, reader_stderr = reader.communicate()
                  state = repo.path / '.goal-teams'
                  files = {}
                  for name in ('ledger.jsonl', 'ledger.head', 'journal.json', '.lock'):
                      target = state / name
                      files[name] = target.read_text(encoding='utf-8', errors='replace') if target.exists() else None
                  evidence = dict(scenario='controlled_real_handle_mechanism_not_natural_CI_reproduction',
                                  production_base='05560126b2c97d850d8a368a0d672ef2cbdda833',
                                  diagnostic_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                                  gitinfo_sha256=hashlib.sha256((SCRIPTS/'goalteams/gitinfo.py').read_bytes()).hexdigest(),
                                  observation=observation, child_exit=result.returncode,
                                  child_stdout=result.stdout, child_stderr=result.stderr,
                                  reader_exit=reader.returncode, reader_stdout=reader_stdout,
                                  reader_stderr=reader_stderr, state_files=files,
                                  asserted_contract='real run succeeds and source hashing never opens ignored state')
                  (trace_dir/'mechanism-result.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('CONTROLLED_STATE_HASH_REPLACE_BEGIN', flush=True)
                  print(json.dumps(evidence, ensure_ascii=False, indent=2), flush=True)
                  print('CONTROLLED_STATE_HASH_REPLACE_END', flush=True)
                  self.assertEqual(reader.returncode, 0, reader_stderr)
                  self.assertEqual(result.returncode, 0, result.stderr)
                  self.assertEqual(observation['ignored_paths'], [])
                  self.assertIsNone(observation['held_path'])
                  self.assertEqual(repo.gt('verify').returncode, 0)

          result = unittest.TextTestRunner(verbosity=2, stream=sys.stdout).run(
              unittest.TestSuite([StateHashReplaceMechanism()]))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
