name: Goal Teams checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: incremental-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require checkout SSH key
        env:
          CHECKOUT_SSH_KEY: ${{ secrets.GOAL_TEAMS_CHECKOUT_SSH_KEY }}
        run: |
          test -n "${CHECKOUT_SSH_KEY}" || {
            echo "E_V250_CHECKOUT_SSH_KEY_REQUIRED" >&2
            exit 1
          }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GOAL_TEAMS_CHECKOUT_SSH_KEY }}
          persist-credentials: false
      - name: Assert exact SSH fetch and push transport
        run: |
          expected="git@github.com:${GITHUB_REPOSITORY}.git"
          test "$(git remote get-url origin)" = "${expected}"
          test "$(git remote get-url --push origin)" = "${expected}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare pinned Draft 2020 validator outside the worktree
        env:
          VALIDATOR_PYTHON_PREFIX: ${{ runner.temp }}/goal-teams-v250-python
        run: |
          python3 -m pip install \
            --target "${VALIDATOR_PYTHON_PREFIX}" \
            --no-compile \
            --no-cache-dir \
            jsonschema==4.23.0
          PYTHONPATH="${VALIDATOR_PYTHON_PREFIX}" python3 -c \
            'from jsonschema import Draft202012Validator'
          echo "PYTHONPATH=${VALIDATOR_PYTHON_PREFIX}${PYTHONPATH:+:${PYTHONPATH}}" >> "${GITHUB_ENV}"
      - name: V2.62 TDD and affected-surface incremental checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests/v250 -p 'test_*.py'
          python3 -m unittest discover -s tests/v262 -p 'test_*.py'
          python3 scripts/checks/check-v250.py --phase development --project-size medium --stage candidate
          python3 scripts/checks/check-package-manifest.py
